name: Build and deploy resume
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Render HTML
        run: |
          mkdir -p _site
          uv run --no-project --with-requirements requirements.txt generate.py > _site/index.html
      # Page size and margins come from the template's @page rule.
      - name: Print PDF
        run: >
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer
          --virtual-time-budget=10000 --print-to-pdf=_site/resume.pdf
          "file://$PWD/_site/index.html"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
